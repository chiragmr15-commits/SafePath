<!DOCTYPE html>
<html>
<head>

    <title>SafePath AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #111827 100%);
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle at 30% 30%, rgba(236, 72, 153, 0.8), rgba(139, 92, 246, 0.3));
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.6; }
        }

        .glow-button {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glow-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .glow-button:hover::before {
            left: 100%;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.4);
        }
    </style>

</head>

<body class="flex items-center justify-center h-screen">

<script>
    // Check if user is authenticated and redirect
    window.addEventListener('load', function() {
        // This will be handled by Django's login_required decorator
    });
</script>

<div class="text-center relative z-10">

    <div class="mb-8">
        <i class="fas fa-shield-heart text-6xl" style="background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
    </div>

    <h1 class="text-6xl font-bold mb-4">
        SafePath AI
    </h1>

    <p class="text-gray-400 text-xl mb-2">
        Smart Women Safety Navigation System
    </p>

    <p class="text-gray-500 text-sm mb-8 max-w-md mx-auto">
        AI-powered route analysis, community alerts, and real-time safety monitoring
    </p>

    {% if user.is_authenticated %}
        <a href="/dashboard/">
            <button class="glow-button bg-pink-500 px-12 py-4 rounded-xl text-xl font-bold text-white mt-6">
                <i class="fas fa-arrow-right"></i> Go to Dashboard
            </button>
        </a>
        <div class="mt-6">
            <p class="text-gray-400 text-sm">
                Logged in as <span class="text-pink-400 font-semibold">{{ user.username }}</span>
            </p>
        </div>
    {% else %}
        <a href="/login/">
            <button class="glow-button bg-pink-500 px-12 py-4 rounded-xl text-xl font-bold text-white mt-6">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </a>
        <div class="mt-6 space-y-2">
            <p class="text-gray-400 text-sm">
                Don't have an account? 
                <a href="/register/" class="text-pink-400 hover:text-pink-300 font-semibold">
                    Create one now
                </a>
            </p>
        </div>
    {% endif %}

</div>

</body>
</html>
